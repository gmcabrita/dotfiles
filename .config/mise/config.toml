[bootstrap.mise_shell_activate]

[bootstrap.brew.taps]

[bootstrap.packages]

[tool_alias]
tlaplus = "github:tlaplus/tlaplus"

[tools]
"aqua:smol-machines/smolvm" = "latest"
"cargo:hurlfmt" = "latest"
"cargo:iodyne" = "latest"
"cargo:oha" = "latest"
"cargo:pdf-inspector" = "latest"
"cargo:ree-cli" = "latest"
"cargo:rustdoc-text" = "latest"
"github:AmanVarshney01/tcut" = "latest"
"github:duckdb/duckdb" = "latest"
"github:LalitMaganti/buildprof" = "latest"
"github:lexiforest/curl-impersonate" = { version = "latest", prerelease = true }
"github:qbdi/qbdi" = "latest"
"github:rockorager/zigdoc" = "latest"
"github:rockorager/ziglint" = "latest"
"github:sharkdp/hyperfine" = { version = "latest", prerelease = true }
"go:github.com/tailscale/tailcat/cmd/tailcat" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@opencode/browse" = "latest"
"npm:agent-desktop" = "latest"
"npm:ccusage" = "latest"
"npm:portless" = "latest"
"npm:sfw" = "latest"
"npm:skills" = "latest"
bun = "latest"
deno = "latest"
elixir = "latest"
erlang = "latest"
fnox = "latest"
go = "latest"
helm = "latest"
hk = "latest"
jactionlint = "latest"
java = "latest"
mr-boxington = "latest"
node = "latest"
pitchfork = "latest"
pkl = "latest"
pnpm = "latest"
pulumi = "latest"
python = "latest"
ruby = { version = "latest", postinstall = "gem install benchmark-ips debug gem-why memory_profiler openssl profile-viewer ruby-lsp stackprof tty-prompt gum vernier" }
rust = { version = "latest", mr_boxington = true }
shellcheck = "latest"
sops = "latest"
tak = "latest"
tlaplus = { version = "latest", asset_pattern = "tla2tools.jar", format = "raw", bin = "tla2tools.jar" }
tree-sitter = "latest"
trufflehog = "latest"
uv = "latest"
watchexec = "latest"
zig = "latest"
zizmor = "latest"
zls = "latest"

[settings]
auto_update = true
auto_update_check_duration = "1d"
experimental = true
idiomatic_version_file_enable_tools = ["rust", "go"]
minimum_release_age = "2h"

[settings.status]
show_env = true
show_tools = true

[settings.python]
uv_venv_auto = true

[settings.npm]
package_manager = "pnpm"

[settings.ruby]
compile = false
