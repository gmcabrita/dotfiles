modelRoles:
  default: anthropic/claude-fable-5-1:high
  plan: anthropic/claude-fable-5-1:max
  task: anthropic/claude-fable-5-1:medium
  designer: anthropic/claude-fable-5-1:medium

  advisor: openai-codex-lb/gpt-6-astra:high
  review: openai-codex-lb/gpt-6-astra:high
  slow: openai-codex-lb/gpt-6-astra:max
  vision: openai-codex-lb/gpt-6-astra:medium

  smol: openai-codex-lb/gpt-reserve
  tiny: "@smol"
  commit: "@smol"

  reverse: deepseek/deepseek-flash:high

task:
  agentModelOverrides:
    reviewer: "@review"
    security-reviewer: "@review"
    reverser: "@reverse"

defaultThinkingLevel: high

advisor:
  enabled: true
  immuneTurns: 3
  syncBacklog: "3"

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex-lb/gpt-5.6-sol
    smol:
      - openai-codex-lb/gpt-5.6-luna
    advisor:
      - openai-codex-lb/gpt-5.6-sol

symbolPreset: nerd

composer:
  shape: band

theme:
  light: light

setupVersion: 2
